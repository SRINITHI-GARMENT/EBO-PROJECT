<!DOCTYPE html>
<html>

<head>
    <title>Edit Actual Stock</title>
    <style>
        body {
            font-family: Arial;
            background: #f4f4f4;
            padding: 20px;
        }

        .main-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
        }

        .main-nav a {
            display: inline-block;
            padding: 10px 14px;
            border-radius: 8px;
            background: #1e293b;
            color: white;
            text-decoration: none;
        }

        .form-box {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            max-width: 700px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
        }

        button {
            padding: 10px 18px;
            background: #1e293b;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="main-nav">
        <a href="/base-stock">Base Stock</a>
        <a href="/actual-stock">Actual Stock</a>
        <a href="/requirement-report">Report</a>
        <a href="/order-sheet">Order Sheet</a>
        <a href="/custom-order-generation">Custom Order</a>
        <a href="/users">Users</a>
    </div>

    <div class="form-box">
        <h1>Edit Actual Stock</h1>

        <form method="POST">
            <input name="ebo" value="{{ row.ebo }}" placeholder="EBO">
            <input name="product" value="{{ row.product }}" placeholder="PRODUCT">
            <input name="color" value="{{ row.color }}" placeholder="COLOR">
            <input name="size" value="{{ row.size }}" placeholder="SIZE">
            <input name="actual_qty" value="{{ row.actual_qty }}" placeholder="ACTUAL QTY">

            <button type="submit">Update Actual Stock</button>
        </form>
    </div>

</body>

</html>
