<!DOCTYPE html>
<html>

<head>
    <title>Change Password</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            padding: 20px;
            margin: 0;
        }

        .main-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
        }

        .main-nav a {
            display: inline-block;
            padding: 10px 16px;
            border-radius: 6px;
            background: #1e293b;
            color: white;
            text-decoration: none;
            font-size: 14px;
        }

        .main-nav a:hover {
            background: #334155;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
            max-width: 400px;
            margin: 0 auto;
        }

        .card h1 {
            margin-bottom: 20px;
            color: #1e293b;
            text-align: center;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #374151;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: #1e293b;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        .btn:hover {
            background: #334155;
        }

        .error {
            color: #dc2626;
            background: #fef2f2;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            border: 1px solid #fecaca;
        }

        .success {
            color: #059669;
            background: #ecfdf5;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            border: 1px solid #a7f3d0;
        }
    </style>

</head>

<body>

    {% include "components/navbar_header.html" %}

    <div class="main-nav">
        <a href="/base-stock">Base Stock</a>
        <a href="/actual-stock">Actual Stock</a>
        <a href="/requirement-report">Report</a>
        <a href="/order-sheet">Order Sheet</a>
        <a href="/custom-order-generation">Custom Order</a>
        <a href="/users">Users</a>
    </div>

    <div class="card">

        <h1>Change Password</h1>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        {% if success %}
        <div class="success">{{ success }}</div>
        {% endif %}

        <form method="POST">

            <div class="form-group">
                <label for="current_password">Current Password</label>
                <input type="password" id="current_password" name="current_password" required>
            </div>

            <div class="form-group">
                <label for="new_password">New Password</label>
                <input type="password" id="new_password" name="new_password" required>
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirm New Password</label>
                <input type="password" id="confirm_password" name="confirm_password" required>
            </div>

            <button class="btn" type="submit">Change Password</button>

        </form>

    </div>

</body>

</html>
